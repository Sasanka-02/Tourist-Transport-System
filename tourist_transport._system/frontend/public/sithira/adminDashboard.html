<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Management | Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/admin-dashboard.css">
</head>
<body>
  <div class="admin-wrapper">
    <!-- Sidebar -->
    <nav class="admin-sidebar">
      <div class="sidebar-header">
        <i class="bi bi-shield-lock"></i>
        <span>Admin Panel</span>
      </div>
      <ul class="sidebar-menu">
        <li class="active">
          <a href="#">
            <i class="bi bi-database"></i>
            <span>Data Management</span>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="bi bi-graph-up"></i>
            <span>Analytics</span>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="bi bi-people"></i>
            <span>User Management</span>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="bi bi-gear"></i>
            <span>Settings</span>
          </a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <a href="admin-login.html" class="logout-btn">
          <i class="bi bi-box-arrow-left"></i>
          <span>Logout</span>
        </a>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-header">
        <h1><i class="bi bi-database"></i> Historical Data Management</h1>
      </header>
      
      <div class="admin-content">
        <div class="data-management-card">
          <div class="card-body">
            <div class="data-info">
              <div><strong>Current Dataset:</strong> 2023-2024</div>
              <div><strong>Accuracy:</strong> <span class="accuracy-value">88%</span></div>
            </div>
            
            <div class="model-info">
              <i class="bi bi-calendar"></i>
              <span>Last Model Training: 2024-12-15</span>
            </div>
            
            <div class="action-buttons">
              <button class="btn btn-action upload-btn">
                <i class="bi bi-cloud-arrow-up"></i>
                Upload New Data
              </button>
              <button class="btn btn-action retrain-btn">
                <i class="bi bi-arrow-repeat"></i>
                Retrain Model
              </button>
              <button class="btn btn-action metrics-btn">
                <i class="bi bi-graph-up"></i>
                View Accuracy Metrics
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- File Upload Modal -->
  <div class="modal fade" id="uploadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Upload New Dataset</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="uploadForm">
            <div class="mb-3">
              <label for="datasetName" class="form-label">Dataset Name</label>
              <input type="text" class="form-control" id="datasetName" required>
            </div>
            <div class="mb-3">
              <label for="datasetFile" class="form-label">CSV File</label>
              <input type="file" class="form-control" id="datasetFile" accept=".csv" required>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="updateModel">
              <label class="form-check-label" for="updateModel">Update model after upload</label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" form="uploadForm" class="btn btn-primary">Upload</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/admin-dashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
