<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tourist Forecast Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard-container">
    <div class="forecast-card">
      <div class="card-header">
        <i class="bi bi-bar-chart"></i>
        <span>Galle Forecast (June 2025)</span>
      </div>
      <div class="card-body">
        <div class="data-source">
          <i class="bi bi-database"></i>
          Data Source: 2023-2024 Immigration
        </div>
        
        <div class="comparison-container">
          <div class="year-box current">
            <div class="year-label">2025</div>
            <div class="value">1,200 <span class="trend up">▲ 20%</span></div>
          </div>
          <div class="year-box previous">
            <div class="year-label">2024 Actual</div>
            <div class="value">1,000</div>
          </div>
        </div>
        
        <div class="top-countries">
          <div class="section-title">Top Countries (Predicted)</div>
          <div class="country-tags">
            <span class="country-tag">Germany (35%)</span>
            <span class="country-tag">India (28%)</span>
            <span class="country-tag">UK (18%)</span>
            <span class="country-tag">China (12%)</span>
          </div>
        </div>
        
        <button class="report-btn">
          <i class="bi bi-file-earmark-text"></i>
          Generate Full Report
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
